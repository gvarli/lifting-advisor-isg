<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="104" fill="url(#bgDark)"/>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#gradYellow)" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Rigging Chains / Angle Lines -->
  <line x1="256" y1="90" x2="130" y2="280" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" stroke-dasharray="24 12"/>
  <line x1="256" y1="90" x2="382" y2="280" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" stroke-dasharray="24 12"/>

  <!-- Master Link (Apex Oval) -->
  <ellipse cx="256" cy="90" rx="42" ry="58" fill="none" stroke="url(#gradYellow)" stroke-width="22"/>

  <!-- Heavy Duty Crane Hook Silhouette -->
  <g transform="translate(256, 330)">
    <!-- Swivel Body -->
    <rect x="-30" y="-70" width="60" height="40" rx="8" fill="#F8FAFC"/>
    <circle cx="0" cy="-50" r="10" fill="#0F172A"/>

    <!-- Hook Shank & Throat -->
    <path d="M-18,-30 L18,-30 L18,20 C18,65 -20,95 -65,70 C-105,45 -95,-15 -50,-35 C-35,-42 -22,-20 -35,-12 C-55,2 -60,40 -35,55 C-10,70 12,50 12,20 L12,-30 Z" fill="url(#gradYellow)"/>
    
    <!-- Safety Latch -->
    <line x1="12" y1="-10" x2="-35" y2="15" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Load Beam Base Indicator -->
  <rect x="90" y="420" width="332" height="24" rx="6" fill="#334155"/>
  <rect x="90" y="420" width="332" height="24" rx="6" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="16 16"/>

  <!-- Text / Monogram -->
  <text x="256" y="480" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" fill="#F59E0B" text-anchor="middle" letter-spacing="3">LIFTING • ISG</text>
</svg>
